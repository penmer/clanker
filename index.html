function impulse(px,py,force){
  let best=0,bd=1e9;P.forEach((p,i)=>{const d=Math.hypot(p.x-px,p.y-py);if(d<bd){bd=d;best=i;}});
  const p=P[best];let dx=p.x-px,dy=p.y-py,d=Math.hypot(dx,dy)||1;dx/=d;dy/=d;
  const F=force*0.9;p.px-=dx*F;p.py-=dy*F-3;
  const seen=new Set([best]);let frontier=[best],depth=0;
  while(frontier.length&&depth<3){const next=[];
    for(const idx of frontier)for(const c of C){
      const other=c.a===idx?c.b:c.b===idx?c.a:-1;
      if(other>=0&&!seen.has(other)){seen.add(other);next.push(other);
        const f2=F*Math.pow(0.45,depth+1);P[other].px-=dx*f2;P[other].py-=dy*f2*0.7;}}
    frontier=next;depth++;}
  burst(px,py,8+force*0.35,"#ff9ec6");
  rings.push({x:px,y:py,r:6,life:1});
  for(const q of envProps){const dd=Math.hypot(q.x-px,q.y-py);
    if(dd<160){const s2=force*(1-dd/160)*0.5;
      q.vx+=(q.x-px)/Math.max(1,dd)*s2;q.vy-=s2*0.5;}}
}

function blobPath(cx,cy,R,rot,droop,seed,sx2,sy2){
  const N=48;ctx.beginPath();
  const t1=now_/900+seed,t2=now_/1300-seed*2,t3=now_/700+seed*3;
  let fx,fy;
  for(let i=0;i<=N;i++){

    let r=R*(1+0.045*Math.sin(3*th+t1)+0.03*Math.sin(5*th-t2)+0.018*Math.sin(7*th+t3));
    const dn=Math.sin(th+rot); // +1 = screen-down in rotated frame
    if(dn>0)r*=1+droop*0.14*dn;       // sag: bottom-heavy as he deflates
    else r*=1-droop*0.07*(-dn);       // top flattens
    const x0=Math.cos(th)*r,y0=Math.sin(th)*r;
    const x=cx+(x0*Math.cos(rot)-y0*Math.sin(rot))*sx2;
    const y=cy+(x0*Math.sin(rot)+y0*Math.cos(rot))*sy2;
    if(i===0){ctx.moveTo(x,y);fx=x;fy=y;}else ctx.lineTo(x,y);}

function startDrag(i,x,y,pid){const g=document.createElement("div");g.className="drag-ghost";g.textContent=W_[i].ic;

function moveDrag(pid,x,y){const d2=drags.get(pid);if(!d2)return;
  // rubber-band: ghost eases toward pointer; magnetic pull toward Clanker
  const r=wrap.getBoundingClientRect();
  const hxs=P[HEAD].x+r.left,hys=P[HEAD].y+r.top;
  const hd=Math.hypot(x-hxs,y-hys);
  let tx=x,ty=y;
  if(hd<150){tx+= (hxs-x)*0.22*(1-hd/150)*1.4; ty+=(hys-y)*0.22*(1-hd/150)*1.4;}
  d2.gx+= (tx-d2.gx)*0.4; d2.gy+=(ty-d2.gy)*0.4;
  d2.g.style.left=d2.gx+"px";d2.g.style.top=d2.gy+"px";
  if(now_-trailT>50){trailT=now_;const tr=document.createElement("div");tr.className="trail";
    tr.style.left=(d2.gx-4)+"px";tr.style.top=(d2.gy-4)+"px";document.body.appendChild(tr);
    requestAnimationFrame(()=>{tr.style.opacity=0;tr.style.transform="scale(.3)";});
    setTimeout(()=>tr.remove(),520);}}
function nearBody(x,y){let bd=1e9;P.forEach(p=>{bd=Math.min(bd,Math.hypot(p.x-x,p.y-y));});return bd<160;}
let mvPend=null,dread=0,dreadX=0,flinched=false;
window.addEventListener("pointermove",e=>{
  if(drags.has(e.pointerId)){moveDrag(e.pointerId,e.clientX,e.clientY);
    const r=wrap.getBoundingClientRect(),gx=e.clientX-r.left,gy=e.clientY-r.top;
    const hd=Math.hypot(gx-P[HEAD].x,gy-P[HEAD].y);
    dread=Math.max(0,1-hd/220);dreadX=gx<P[HEAD].x?-1:1;
    if(hd<120&&!flinched){flinched=true;
      P[HEAD].px+=dreadX*5;P[HANDL].py+=6;P[HANDR].py+=6;
      if(Math.random()<.4){say(tierOf()===0?"is this the game? i was built for this.":"okay. okay okay okay.");}}
    if(hd>170)flinched=false;}
  if(grab&&e.pointerId===grab.pid){const r=wrap.getBoundingClientRect();grab.x=e.clientX-r.left;grab.y=e.clientY-r.top;
    if(!grab.moved&&Math.hypot(grab.x-grab.sx,grab.y-grab.sy)>10){grab.moved=true;sfxN('servo');

  {const r=wrap.getBoundingClientRect();
   if(e.clientY<r.bottom-4&&e.clientX>=r.left&&e.clientX<r.right&&!drags.size&&W_[equipped]&&!(grab&&grab.moved)){
     eqc.style.display="block";eqc.style.left=(e.clientX-r.left)+"px";eqc.style.top=(e.clientY-r.top)+"px";
     eqc.textContent=W_[equipped].ic;
   } else eqc.style.display="none";}
});
window.addEventListener("pointerup",e=>{
  const d2=drags.get(e.pointerId);
  if(d2){const r=wrap.getBoundingClientRect(),lx=e.clientX-r.left,ly=e.clientY-r.top;
    if(e.clientY<r.bottom){if(nearLumen(lx,ly))hitLumen(d2.i,lx,ly);
      else if(nearBody(lx,ly))hit(d2.i,lx,ly);}
    d2.g.remove();drags.delete(e.pointerId);dread=0;flinched=false;}
  if(grab&&e.pointerId===grab.pid){
    const g=grab;grab=null;
    if(!g.moved){if(g.who==='L')hitLumen(equipped,g.x,g.y);else hit(equipped,g.x,g.y);}
    else if(g.who==='L')lumenSay(["landed. graceful as ever.","i'm okay! mostly okay.","tell him i stuck the landing."][rot++%3]);

cv.addEventListener("pointerdown",e=>{

    if(dd2<bd){bd=dd2;best=i;list=LP;}});}
  if(bd<95&&!grab){grab={list,i:best,x,y,pid:e.pointerId,sx:x,sy:y,moved:false,who:list===P?'C':'L'};}

});
